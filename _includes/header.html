<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.author.name }} — home">
      <span class="brand-mark" aria-hidden="true">&gt;_</span>
      <span class="brand-text">{{ site.author.name }}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.collection == 'posts' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a class="nav-rss" href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </div>
</header>
