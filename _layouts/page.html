---
layout: default
---
<main id="main" class="page wrap">
  <header class="page-head">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="dek">{{ page.description }}</p>{% endif %}
  </header>
  <div class="page-body">
    {{ content }}
  </div>
</main>
