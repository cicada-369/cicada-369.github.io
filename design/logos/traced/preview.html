<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#f3f5f6;font-family:"Liberation Sans",Arial,sans-serif;color:#171b1f}
.wrap{display:flex;gap:24px;padding:32px}
.card{background:#fff;border:1px solid #dfe3e6;border-radius:14px;padding:20px;width:360px;box-sizing:border-box}
h2{font-size:16px;margin:0 0 4px}
p{font-size:13px;color:#5b6672;margin:0 0 16px;min-height:36px}
.big{width:300px;height:300px;display:block;margin:0 auto}
.small{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid #dfe3e6}
.small img{width:32px;height:32px}.small span{font-size:12px;color:#5b6672}
</style></head><body><div class="wrap">
<div class="card"><h2>A — Silhouette, knockout</h2><p>Solid cicada from your drawing; 369 cut out in the tile color.</p><img class="big" src="a-knockout.svg"><div class="small"><img src="a-knockout.svg"><span>32 px</span></div></div>
<div class="card"><h2>B — Silhouette, white</h2><p>Solid cicada; 369 in white across the folded wings.</p><img class="big" src="b-white.svg"><div class="small"><img src="b-white.svg"><span>32 px</span></div></div>
<div class="card"><h2>C — Line art, white</h2><p>The drawing's full line work; 369 in white over it.</p><img class="big" src="c-lineart-white.svg"><div class="small"><img src="c-lineart-white.svg"><span>32 px</span></div></div>
</div></body></html>
