<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#f3f5f6;font-family:"Liberation Sans",Arial,sans-serif;color:#171b1f}
.wrap{display:flex;gap:18px;padding:28px}
.card{background:#fff;border:1px solid #dfe3e6;border-radius:14px;padding:16px;width:310px;box-sizing:border-box}
h2{font-size:15px;margin:0 0 4px}
p{font-size:12px;color:#5b6672;margin:0 0 12px;min-height:32px}
.big{width:270px;height:270px;display:block;margin:0 auto}
.small{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid #dfe3e6}
.small img{width:32px;height:32px}.small span{font-size:12px;color:#5b6672}
</style></head><body><div class="wrap">
<div class="card"><h2>C — original</h2><p>Traced strokes, unmodified.</p><img class="big" src="c-lineart-white.svg"><div class="small"><img src="c-lineart-white.svg"><span>32 px</span></div></div>
<div class="card"><h2>Thick 13</h2><p>Light thickening.</p><img class="big" src="thick-13.svg"><div class="small"><img src="thick-13.svg"><span>32 px</span></div></div>
<div class="card"><h2>Thick 21</h2><p>Medium thickening.</p><img class="big" src="thick-21.svg"><div class="small"><img src="thick-21.svg"><span>32 px</span></div></div>
<div class="card"><h2>Thick 31</h2><p>Heavy; internal detail starts merging.</p><img class="big" src="thick-31.svg"><div class="small"><img src="thick-31.svg"><span>32 px</span></div></div>
</div></body></html>
