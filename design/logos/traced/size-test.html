<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#f3f5f6;font-family:"Liberation Sans",Arial,sans-serif;color:#171b1f}
.section{padding:24px 28px}
h2{font-size:14px;margin:0 0 12px;color:#5b6672;font-weight:600}
.row{display:flex;align-items:flex-end;gap:24px;margin-bottom:18px}
.item{text-align:center;font-size:11px;color:#5b6672}
.item img{display:block;margin:0 auto 6px}
.dark{background:#0e1216;border-radius:12px;padding:18px 24px}
.dark h2{color:#93a1ae}
.dark .item{color:#93a1ae}
</style></head><body>
<div class="section">
  <h2>Light background</h2>
  <div class="row">
    <div class="item"><img src="c-lineart-white.svg" width="16" height="16">16</div>
    <div class="item"><img src="c-lineart-white.svg" width="20" height="20">20</div>
    <div class="item"><img src="c-lineart-white.svg" width="24" height="24">24</div>
    <div class="item"><img src="c-lineart-white.svg" width="32" height="32">32</div>
    <div class="item"><img src="c-lineart-white.svg" width="64" height="64">64</div>
    <div class="item"><img src="c-lineart-white.svg" width="128" height="128">128</div>
  </div>
</div>
<div class="section dark">
  <h2>Dark background (site / avatar context)</h2>
  <div class="row">
    <div class="item"><img src="c-lineart-white.svg" width="16" height="16">16</div>
    <div class="item"><img src="c-lineart-white.svg" width="20" height="20">20</div>
    <div class="item"><img src="c-lineart-white.svg" width="24" height="24">24</div>
    <div class="item"><img src="c-lineart-white.svg" width="32" height="32">32</div>
    <div class="item"><img src="c-lineart-white.svg" width="64" height="64">64</div>
    <div class="item"><img src="c-lineart-white.svg" width="128" height="128">128</div>
  </div>
</div>
</body></html>
