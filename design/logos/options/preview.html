<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #f3f5f6; color: #171b1f; font-family: "Liberation Sans", Arial, sans-serif; }
  .wrap { display: flex; gap: 24px; padding: 32px; }
  .card { background: #fff; border: 1px solid #dfe3e6; border-radius: 14px; padding: 20px; width: 360px; box-sizing: border-box; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  p { font-size: 13px; line-height: 1.4; color: #5b6672; margin: 0 0 16px; min-height: 36px; }
  .big { width: 280px; height: 280px; display: block; margin: 0 auto; }
  .small { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #dfe3e6; }
  .small img { width: 32px; height: 32px; }
  .small span { font-size: 12px; color: #5b6672; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>A — Folded wings</h2>
      <p>Top-down cicada, wings folded over the body, 369 across them.</p>
      <img class="big" src="a-silhouette-369.svg" alt="">
      <div class="small"><img src="a-silhouette-369.svg" alt=""><span>32 px</span></div>
    </div>
    <div class="card">
      <h2>B — Numbered abdomen</h2>
      <p>Folded-wing silhouette; 369 stacked vertically as the abdomen.</p>
      <img class="big" src="b-emblem-stack.svg" alt="">
      <div class="small"><img src="b-emblem-stack.svg" alt=""><span>32 px</span></div>
    </div>
    <div class="card">
      <h2>C — Head-on</h2>
      <p>Front view: wide head, bulging eyes, 369 across the thorax.</p>
      <img class="big" src="c-badge.svg" alt="">
      <div class="small"><img src="c-badge.svg" alt=""><span>32 px</span></div>
    </div>
  </div>
</body>
</html>
